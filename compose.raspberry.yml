name: basketra
services:
  basketra:
    image: ${BASKETRA_IMAGE:-ghcr.io/juanjogondev/basketra:stable}
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      - "${BASKETRA_BIND_ADDRESS:-127.0.0.1}:${BASKETRA_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_OPTIONS: --max-old-space-size=${BASKETRA_NODE_HEAP_MB:-128}
      BASKETRA_HOST: 0.0.0.0
      BASKETRA_PORT: 3000
      BASKETRA_DATA_DIR: /data
      BASKETRA_TEMP_DIR: /tmp/basketra
      BASKETRA_MAX_BODY_BYTES: ${BASKETRA_MAX_BODY_BYTES:-8388608}
      BASKETRA_AI_BASE_URL: ${BASKETRA_AI_BASE_URL:-}
      BASKETRA_AI_API_KEY: ${BASKETRA_AI_API_KEY:-}
      BASKETRA_AI_MODEL: ${BASKETRA_AI_MODEL:-}
      BASKETRA_AI_TIMEOUT_MS: 0
      BASKETRA_AI_MAX_RETRIES: ${BASKETRA_AI_MAX_RETRIES:-1}
      BASKETRA_AI_IMAGE_CAPABILITY: ${BASKETRA_AI_IMAGE_CAPABILITY:-true}
      BASKETRA_AI_PDF_CAPABILITY: ${BASKETRA_AI_PDF_CAPABILITY:-false}
      BASKETRA_IDLE_HIBERNATE_AFTER_MS: ${BASKETRA_IDLE_HIBERNATE_AFTER_MS:-300000}
      IDLE_EXIT_AFTER_MS: ${IDLE_EXIT_AFTER_MS:-0}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: basketra
    volumes:
      - basketra-data:/data
    tmpfs:
      - /tmp/basketra:rw,noexec,nosuid,size=32m,mode=0700,uid=1000,gid=1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${BASKETRA_MEMORY_LIMIT:-192m}
    memswap_limit: ${BASKETRA_MEMORY_LIMIT:-192m}
    cpus: ${BASKETRA_CPU_LIMIT:-0.75}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  watchtower:
    profiles:
      - autoupdate
    image: containrrr/watchtower:1.7.1
    container_name: basketra-watchtower
    init: true
    restart: unless-stopped
    environment:
      DOCKER_CONFIG: /config
      DOCKER_API_VERSION: ${WATCHTOWER_DOCKER_API_VERSION:-1.52}
      TZ: ${TZ:-Europe/Madrid}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_REMOVE_VOLUMES: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_SCOPE: basketra
      WATCHTOWER_TIMEOUT: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: basketra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BASKETRA_DOCKER_CONFIG_DIR:-./.docker}:/config:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: ${WATCHTOWER_MEMORY_LIMIT:-128m}
    memswap_limit: ${WATCHTOWER_MEMORY_LIMIT:-128m}
    cpus: ${WATCHTOWER_CPU_LIMIT:-0.25}
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  basketra-data:
    name: basketra-data
