name: basketra
services:
  basketra:
    image: ghcr.io/juanjogondev/basketra:stable
    pull_policy: always
    command: ["node", "--max-old-space-size=128", "dist/main.js"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: basketra
    volumes:
      - basketra-data:/data
    tmpfs:
      - /tmp/basketra:rw,noexec,nosuid,size=32m,mode=0700,uid=1000,gid=1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.75
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  watchtower:
    profiles:
      - autoupdate
    image: containrrr/watchtower:1.7.1
    container_name: basketra-watchtower
    init: true
    restart: unless-stopped
    environment:
      DOCKER_CONFIG: /config
      DOCKER_API_VERSION: "1.52"
      TZ: Europe/Madrid
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_REMOVE_VOLUMES: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_SCOPE: basketra
      WATCHTOWER_TIMEOUT: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: basketra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.docker:/config:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  basketra-data:
    name: basketra-data
