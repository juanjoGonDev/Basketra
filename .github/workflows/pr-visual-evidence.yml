          _The temporary prerelease and its media are replaced on every PR update and deleted when the PR closes._
          EOF

          marker='<!-- basketra-visual-evidence -->'
          comment_id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          jq -n --rawfile body comment.md '{body: $body}' > payload.json

          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/$REPOSITORY/issues/comments/$comment_id" \
              --input payload.json >/dev/null
          else
            gh api --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --input payload.json >/dev/null
          fi
