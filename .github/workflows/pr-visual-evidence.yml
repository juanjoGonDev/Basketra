          ### Progressive swipe thresholds

          <table>
          <tr>
          <td><strong>Shopping list: short swipe reveals actions</strong><br><img src="$base/02-shopping-list-lifecycle.png" width="280" alt="Shopping-list row partially swiped to reveal edit and delete actions"></td>
