          <tr>
          <th>Approved reference</th>
          <th>Validated implementation</th>
          </tr>
          <tr>
          <td><strong>01 · Inventory overview</strong><br><img src="$reference_base/01-inventory-overview.png" width="420" alt="Approved Inventory overview reference"></td>
          <td><strong>Desktop</strong><br><img src="$base/20-inventory-overview-desktop.png" width="420" alt="Validated Inventory overview desktop"><br><strong>Mobile</strong><br><img src="$base/20-inventory-overview-mobile.png" width="240" alt="Validated Inventory overview mobile"></td>
          </tr>
          <tr>
          <td><strong>02 · Product list</strong><br><img src="$reference_base/02-product-list.png" width="420" alt="Approved product list reference"></td>
          <td><img src="$base/21-product-list-desktop.png" width="420" alt="Validated product list desktop"></td>
          </tr>
          <tr>
          <td><strong>03 · Product detail, editor and delete</strong><br><img src="$reference_base/03-product-detail-editor-delete.png" width="420" alt="Approved product detail editor and delete reference"></td>
          <td><strong>Full detail + price history · desktop</strong><br><img src="$base/22-product-detail-desktop.png" width="420" alt="Validated full-page product detail with accessible price history"><br><strong>Editor · mobile</strong><br><img src="$base/22-product-editor-mobile.png" width="240" alt="Validated product editor mobile"><br><strong>Dependency-aware delete</strong><br><img src="$base/22-product-delete-mobile.png" width="240" alt="Validated product delete impact mobile"></td>
          </tr>
          <tr>
          <td><strong>04 · Category management</strong><br><img src="$reference_base/04-category-management.png" width="420" alt="Approved category management reference"></td>
          <td><strong>Desktop</strong><br><img src="$base/23-categories-desktop.png" width="420" alt="Validated categories desktop"><br><strong>Mobile</strong><br><img src="$base/23-categories-mobile.png" width="240" alt="Validated categories mobile"></td>
          </tr>
          <tr>
          <td><strong>05 · Stores and Statistics</strong><br><img src="$reference_base/05-stores-statistics.png" width="420" alt="Approved stores and statistics reference"></td>
          <td><strong>Stores · mobile</strong><br><img src="$base/24-stores-mobile.png" width="240" alt="Validated stores mobile"><br><strong>Statistics · desktop</strong><br><img src="$base/24-statistics-desktop.png" width="420" alt="Validated statistics desktop"></td>
          </tr>
          <tr>
          <td><strong>06 · Ticket history and editor</strong><br><img src="$reference_base/06-ticket-history-editor.png" width="420" alt="Approved ticket history and editor reference"></td>
          <td><strong>History · desktop</strong><br><img src="$base/25-ticket-history-desktop.png" width="420" alt="Validated ticket history desktop"><br><strong>Editor · desktop</strong><br><img src="$base/25-ticket-editor-desktop.png" width="420" alt="Validated historical ticket editor desktop"><br><strong>History · mobile</strong><br><img src="$base/25-ticket-history-mobile.png" width="240" alt="Validated ticket history mobile"></td>
          </tr>
          </table>

          ### Catalog management

          <img src="$base/13-catalog-management.png" width="320" alt="Basketra saved-product catalog management on a 390 pixel mobile viewport with canonical product, parent relation and retailer-specific names">

