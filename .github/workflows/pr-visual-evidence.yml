name: Publish PR visual evidence

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: read-all

concurrency:
  group: pr-visual-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: "🔎 Classify visual impact"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.visual-impact.outputs.required }}
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout visual evidence policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Classify visual evidence impact
        id: visual-impact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/pr-files.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | {filename, previous_filename}' | \
            jq -s '.' > "$changed_files"

          required=$(env -u GH_TOKEN node scripts/pr-visual-evidence-policy.mjs "$changed_files")
          if [ "$required" != "true" ] && [ "$required" != "false" ]; then
            echo "Visual evidence policy returned an invalid decision: $required" >&2
            exit 1
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "Visual evidence required: src/web/** or a canonical dependency/workspace file changed."
          else
            echo "Visual evidence skipped: no src/web/** or canonical dependency/workspace files changed."
          fi

  publish:
    name: "🖼️ Publish direct PR evidence"
    needs: classify
    if: needs.classify.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_TAG: pr-${{ github.event.pull_request.number }}-visual-evidence
    steps:
      - name: Wait for the authoritative browser run
        id: quality-run
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            response=$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=pull_request \
              -f head_sha="$HEAD_SHA" \
              -f per_page=20)
            run_id=$(jq -r '[.workflow_runs[] | select(.name == "Pull Request Quality")] | sort_by(.run_number) | last | .id // empty' <<<"$response")
            status=$(jq -r '[.workflow_runs[] | select(.name == "Pull Request Quality")] | sort_by(.run_number) | last | .status // empty' <<<"$response")
            conclusion=$(jq -r '[.workflow_runs[] | select(.name == "Pull Request Quality")] | sort_by(.run_number) | last | .conclusion // empty' <<<"$response")

            if [ -z "$run_id" ]; then
              sleep 15
              continue
            fi
            if [ "$status" != "completed" ]; then
              sleep 15
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "Pull Request Quality run $run_id concluded with $conclusion" >&2
              exit 1
            fi

            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "Timed out waiting for a successful Pull Request Quality run for $HEAD_SHA" >&2
          exit 1

      - name: Download browser output for the validated head
        shell: bash
        env:
          RUN_ID: ${{ steps.quality-run.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name basketra-browser-evidence \
            --dir downloaded
          test -d downloaded/test-results
          if find downloaded -type l -print -quit | grep -q .; then
            echo "Browser evidence must not contain symbolic links" >&2
            exit 1
          fi

      - name: Install the media converter
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i \
                's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              update
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version

      - name: Prepare directly viewable media
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null
          mkdir -p evidence-assets

          find_flow_directory() {
            needle=$1
            directory=$(find downloaded/test-results -mindepth 1 -maxdepth 1 -type d -name "*$needle*" -print -quit)
            if [ -z "$directory" ]; then
              echo "No Playwright evidence directory matched '$needle'. Available directories:" >&2
              find downloaded/test-results -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort >&2
              exit 1
            fi
            printf '%s\n' "$directory"
          }

          prepare_flow() {
            needle=$1
            slug=$2
            screenshot=${3:-final.png}
            directory=$(find_flow_directory "$needle")
            test -f "$directory/$screenshot"
            test -f "$directory/video.webm"

            cp "$directory/$screenshot" "evidence-assets/$slug.png"
            cp "$directory/video.webm" "evidence-assets/$slug.webm"
            ffmpeg -hide_banner -loglevel error -y -t 12 \
              -i "$directory/video.webm" \
              -vf "fps=6,scale=360:-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5" \
              "evidence-assets/$slug.gif"
          }

          copy_flow_capture() {
            needle=$1
            source=$2
            target=$3
            directory=$(find_flow_directory "$needle")
            test -f "$directory/$source"
            cp "$directory/$source" "evidence-assets/$target"
          }

          prepare_flow mobile-PWA-loads 01-mobile-navigation
          prepare_flow shopping-lists-su 02-shopping-list-lifecycle swipe-reveal.png
          prepare_flow local-suggestions 03-stale-suggestions
          prepare_flow imports-without-AI 04-local-ocr-editable-rows swipe-reveal.png
          prepare_flow supports-per-image-retry 05-local-ocr-manual-recovery
          prepare_flow comparison-renders 06-comparison-plans
          prepare_flow AI-unavailability 07-ai-unavailable-recovery
          prepare_flow offline-shell 08-offline-keyboard
          prepare_flow operations-settings-show-l 09-runtime-operations runtime-backups-logs.png
          prepare_flow operations-network-heartbe 10-vpn-recovery vpn-reconnected.png
          prepare_flow mobile-settings-receipts-s 11-responsive-settings settings-dark-430.png
          prepare_flow retailer-autofill 12-ocr-retailer retailer-confirmed.png

          copy_flow_capture shopping-lists-su swipe-delete.png 02-shopping-list-full-delete.png
          copy_flow_capture imports-without-AI swipe-delete.png 04-local-ocr-full-delete.png
          copy_flow_capture mobile-settings-receipts-s settings-light-320.png 11-settings-light-320.png
          copy_flow_capture mobile-settings-receipts-s settings-dark-360.png 11-settings-dark-360.png
          copy_flow_capture mobile-settings-receipts-s settings-light-390.png 11-settings-light-390.png
          copy_flow_capture mobile-settings-receipts-s settings-light-768.png 11-settings-light-768.png
          copy_flow_capture receipt-auto-review-flow-r test-finished-1.png 12-auto-ocr-review.png

          test "$(find evidence-assets -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 19
          test "$(find evidence-assets -maxdepth 1 -type f -name '*.gif' | wc -l)" -eq 12
          test "$(find evidence-assets -maxdepth 1 -type f -name '*.webm' | wc -l)" -eq 12

          while IFS= read -r file; do
            test "$(stat -c %s "$file")" -le 25000000
          done < <(find evidence-assets -maxdepth 1 -type f -print)

      - name: Replace the temporary visual-evidence release
        shell: bash
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication: event head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

          gh release delete "$EVIDENCE_TAG" \
            --repo "$REPOSITORY" \
            --cleanup-tag \
            --yes >/dev/null 2>&1 || true

          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication: event head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

          gh release create "$EVIDENCE_TAG" evidence-assets/* \
            --repo "$REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "PR #$PR_NUMBER visual evidence" \
            --notes "Temporary directly viewable screenshots, GIFs and videos generated from $HEAD_SHA. Removed automatically when the pull request closes."

      - name: Publish or update the visual-evidence comment
        shell: bash
        env:
          RUN_ID: ${{ steps.quality-run.outputs.run_id }}
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication: event head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

          base="https://github.com/$REPOSITORY/releases/download/$EVIDENCE_TAG"
          run_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"

          cat > comment.md <<EOF
          <!-- basketra-visual-evidence -->
          ## Visual evidence

          Generated from final head \`$HEAD_SHA\` after the [successful browser workflow]($run_url). The media is temporary, directly viewable and is not committed to the repository.

          ### Responsive Settings and receipt review

          <table>
          <tr>
          <td><strong>Settings · light · 320 px</strong><br><img src="$base/11-settings-light-320.png" width="240" alt="Basketra Settings at 320 pixels in light mode"></td>
          <td><strong>Settings · dark · 360 px</strong><br><img src="$base/11-settings-dark-360.png" width="240" alt="Basketra Settings at 360 pixels in dark mode"></td>
          <td><strong>Settings · light · 390 px</strong><br><img src="$base/11-settings-light-390.png" width="240" alt="Basketra Settings at 390 pixels in light mode"></td>
          </tr>
          <tr>
          <td><strong>Settings · dark · 430 px</strong><br><img src="$base/11-responsive-settings.png" width="240" alt="Basketra Settings at 430 pixels in dark mode"></td>
          <td><strong>Settings · tablet · 768 px</strong><br><img src="$base/11-settings-light-768.png" width="280" alt="Basketra Settings at tablet width in light mode"></td>
          <td><strong>Automatic OCR review</strong><br><img src="$base/12-auto-ocr-review.png" width="240" alt="Basketra automatic OCR review with grouped capture controls and source evidence"></td>
          </tr>
          <tr>
          <td colspan="3"><strong>Retailer suggestion and confirmed receipt</strong><br><img src="$base/12-ocr-retailer.png" width="360" alt="Basketra receipt review with a saved retailer suggestion and successful confirmation"></td>
          </tr>
          </table>

          **Responsive Settings flow**

          ![Responsive Settings across light and dark devices]($base/11-responsive-settings.gif)

          [Open the full responsive Settings video]($base/11-responsive-settings.webm)

          **Automatic OCR, grouped review and retailer flow**

          ![Automatic OCR and retailer suggestion flow]($base/12-ocr-retailer.gif)

          [Open the full OCR and retailer video]($base/12-ocr-retailer.webm)

          ### Runtime operations and private-route recovery

          <table>
          <tr>
          <td><strong>Runtime, uptime, logs and backup operations</strong><br><img src="$base/09-runtime-operations.png" width="360" alt="Basketra settings showing version, live uptime, redacted logs and backup controls"></td>
          <td><strong>VPN/private route recovered automatically</strong><br><img src="$base/10-vpn-recovery.png" width="360" alt="Basketra connected again after the private route returned without reloading"></td>
          </tr>
          </table>

          **Runtime operations flow**

          ![Runtime operations, logs and backup flow]($base/09-runtime-operations.gif)

          [Open the full runtime operations video]($base/09-runtime-operations.webm)

          **VPN/private-route recovery flow**

          ![Automatic private-route recovery]($base/10-vpn-recovery.gif)

          [Open the full recovery video]($base/10-vpn-recovery.webm)

          ### Progressive swipe thresholds

          <table>
          <tr>
          <td><strong>Shopping list: short swipe reveals actions</strong><br><img src="$base/02-shopping-list-lifecycle.png" width="280" alt="Shopping-list row partially swiped to reveal edit and delete actions"></td>
          <td><strong>Shopping list: full swipe deletes with undo</strong><br><img src="$base/02-shopping-list-full-delete.png" width="280" alt="Shopping-list row deleted after a full swipe with an undo action"></td>
          </tr>
          <tr>
          <td><strong>Receipt: short swipe reveals actions</strong><br><img src="$base/04-local-ocr-editable-rows.png" width="280" alt="Editable receipt row partially swiped to reveal edit and delete actions"></td>
          <td><strong>Receipt: full swipe deletes with undo</strong><br><img src="$base/04-local-ocr-full-delete.png" width="280" alt="Editable receipt row deleted after a full swipe with an undo action"></td>
          </tr>
          </table>

          ### Remaining screens

          <table>
          <tr>
          <td><strong>Mobile navigation</strong><br><img src="$base/01-mobile-navigation.png" width="280" alt="Basketra mobile navigation"></td>
          <td><strong>Stale suggestions</strong><br><img src="$base/03-stale-suggestions.png" width="280" alt="Basketra stale suggestion handling"></td>
          </tr>
          <tr>
          <td><strong>OCR failure and manual recovery</strong><br><img src="$base/05-local-ocr-manual-recovery.png" width="280" alt="Basketra OCR failure and manual euro-row recovery"></td>
          <td><strong>Comparison plans</strong><br><img src="$base/06-comparison-plans.png" width="280" alt="Basketra comparison plans"></td>
          </tr>
          <tr>
          <td><strong>AI unavailable</strong><br><img src="$base/07-ai-unavailable-recovery.png" width="280" alt="Basketra AI unavailable recovery"></td>
          <td><strong>Offline and keyboard</strong><br><img src="$base/08-offline-keyboard.png" width="280" alt="Basketra offline and keyboard behavior"></td>
          </tr>
          </table>

          ### Existing critical flows

          **Shopping-list lifecycle and progressive swipe actions**

          ![Shopping-list lifecycle and progressive swipe actions]($base/02-shopping-list-lifecycle.gif)

          [Open the full shopping-list video]($base/02-shopping-list-lifecycle.webm)

          **Local OCR, editable rows, progressive swipe and euro-denominated values**

          ![Local OCR and editable euro rows]($base/04-local-ocr-editable-rows.gif)

          [Open the full local OCR video]($base/04-local-ocr-editable-rows.webm)

          **OCR failure with preserved draft and manual recovery**

          ![OCR failure and manual recovery]($base/05-local-ocr-manual-recovery.gif)

          [Open the full recovery video]($base/05-local-ocr-manual-recovery.webm)

          **Offline and keyboard behavior**

          ![Offline and keyboard behavior]($base/08-offline-keyboard.gif)

          [Open the full offline video]($base/08-offline-keyboard.webm)

          _The temporary prerelease and its media are replaced on every PR update and deleted when the PR closes._
          EOF

          marker='<!-- basketra-visual-evidence -->'
          comment_id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          jq -n --rawfile body comment.md '{body: $body}' > payload.json

          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/$REPOSITORY/issues/comments/$comment_id" \
              --input payload.json >/dev/null
          else
            gh api --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --input payload.json >/dev/null
          fi
