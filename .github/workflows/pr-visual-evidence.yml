name: Publish PR visual evidence

on:
  workflow_run:
    workflows:
      - Pull Request Quality
    types:
      - completed

permissions: read-all

concurrency:
  group: pr-visual-evidence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  classify:
    name: "🔎 Classify visual impact"
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.visual-impact.outputs.required }}
      pr_number: ${{ steps.pull-request.outputs.pr_number }}
      head_sha: ${{ steps.pull-request.outputs.head_sha }}
      run_id: ${{ steps.pull-request.outputs.run_id }}
    env:
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout trusted visual evidence policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve the exact trusted pull request
        id: pull-request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/pr-candidates.json"
          gh api --paginate "repos/$REPOSITORY/commits/$HEAD_SHA/pulls?per_page=100" | \
            jq -s 'add // []' > "$candidates"

          matches=$(jq \
            --arg repository "$REPOSITORY" \
            --arg head "$HEAD_SHA" \
            '[.[] | select(
              .state == "open" and
              .base.ref == "main" and
              .head.sha == $head and
              .head.repo.full_name == $repository
            )]' "$candidates")
          count=$(jq 'length' <<<"$matches")
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one open same-repository PR for validated head $HEAD_SHA, found $count" >&2
            exit 1
          fi

          pr_number=$(jq -r '.[0].number' <<<"$matches")
          association=$(jq -r '.[0].author_association' <<<"$matches")
          case "$association" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "Refusing visual publication for untrusted author association: $association" >&2
              exit 1
              ;;
          esac

          current_head=$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence preparation: validated head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Classify visual evidence impact
        id: visual-impact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pr_number }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/pr-files.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | {filename, previous_filename}' | \
            jq -s '.' > "$changed_files"

          required=$(env -u GH_TOKEN node scripts/pr-visual-evidence-policy.mjs "$changed_files")
          if [ "$required" != "true" ] && [ "$required" != "false" ]; then
            echo "Visual evidence policy returned an invalid decision: $required" >&2
            exit 1
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "Visual evidence required: src/web/** or a canonical dependency/workspace file changed."
          else
            echo "Visual evidence skipped: no src/web/** or canonical dependency/workspace files changed."
          fi

  prepare:
    name: "🎞️ Prepare direct PR evidence"
    needs: classify
    if: needs.classify.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
      HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
      RUN_ID: ${{ needs.classify.outputs.run_id }}
    steps:
      - name: Download browser output for the validated head
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --pattern 'basketra-browser-shard-*' \
            --dir downloaded
          test -n "$(find downloaded -type f -print -quit)"
          if find downloaded -type l -print -quit | grep -q .; then
            echo "Browser evidence must not contain symbolic links" >&2
            exit 1
          fi

      - name: Install the media converter
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i \
                's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              update
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version

      - name: Prepare directly viewable media
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null
          mkdir -p evidence-assets

          find_flow_directory() {
            needle=$1
            directory=$(find downloaded -type d -name "*$needle*" -print -quit)
            if [ -z "$directory" ]; then
              echo "No Playwright evidence directory matched '$needle'. Available directories:" >&2
              find downloaded -type d -printf '%p\n' | sort >&2
              exit 1
            fi
            printf '%s\n' "$directory"
          }

          prepare_flow() {
            needle=$1
            slug=$2
            screenshot=${3:-final.png}
            directory=$(find_flow_directory "$needle")
            test -f "$directory/$screenshot"
            test -f "$directory/video.webm"

            cp "$directory/$screenshot" "evidence-assets/$slug.png"
            cp "$directory/video.webm" "evidence-assets/$slug.webm"
            ffmpeg -hide_banner -loglevel error -y -t 12 \
              -i "$directory/video.webm" \
              -vf "fps=6,scale=360:-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5" \
              "evidence-assets/$slug.gif"
          }

          find_unique_capture() {
            source=$1
            mapfile -t matches < <(find downloaded -type f -name "$source" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one Playwright capture named '$source', found ${#matches[@]}:" >&2
              printf '  %s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          prepare_unique_flow() {
            screenshot=$1
            slug=$2
            capture=$(find_unique_capture "$screenshot")
            directory=$(dirname "$capture")
            test -f "$directory/video.webm"

            cp "$capture" "evidence-assets/$slug.png"
            cp "$directory/video.webm" "evidence-assets/$slug.webm"
            ffmpeg -hide_banner -loglevel error -y -t 12 \
              -i "$directory/video.webm" \
              -vf "fps=6,scale=360:-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5" \
              "evidence-assets/$slug.gif"
          }

          copy_flow_capture() {
            needle=$1
            source=$2
            target=$3
            directory=$(find_flow_directory "$needle")
            test -f "$directory/$source"
            cp "$directory/$source" "evidence-assets/$target"
          }

          copy_unique_capture() {
            source=$1
            target=$2
            capture=$(find_unique_capture "$source")
            cp "$capture" "evidence-assets/$target"
          }

          prepare_flow mobile-PWA-loads 01-mobile-navigation
          prepare_flow shopping-lists-su 02-shopping-list-lifecycle swipe-reveal.png
          prepare_flow local-suggestions 03-stale-suggestions
          prepare_flow imports-without-AI 04-local-ocr-editable-rows swipe-reveal.png
          prepare_flow supports-per-image-retry 05-local-ocr-manual-recovery
          prepare_flow AI-unavailability 07-ai-unavailable-recovery
          prepare_flow offline-shell 08-offline-keyboard
          prepare_flow operations-settings-show-l 09-runtime-operations runtime-backups-logs.png
          prepare_flow operations-network-heartbe 10-vpn-recovery vpn-reconnected.png
          prepare_flow mobile-settings-receipts-s 11-responsive-settings settings-dark-430.png
          prepare_unique_flow retailer-confirmed.png 12-ocr-retailer

          copy_flow_capture shopping-lists-su swipe-delete.png 02-shopping-list-full-delete.png
          copy_flow_capture imports-without-AI swipe-delete.png 04-local-ocr-full-delete.png
          copy_flow_capture mobile-settings-receipts-s settings-light-320.png 11-settings-light-320.png
          copy_flow_capture mobile-settings-receipts-s settings-dark-360.png 11-settings-dark-360.png
          copy_flow_capture mobile-settings-receipts-s settings-light-390.png 11-settings-light-390.png
          copy_flow_capture mobile-settings-receipts-s settings-light-768.png 11-settings-light-768.png
          copy_flow_capture receipt-auto-review-flow-r test-finished-1.png 12-auto-ocr-review.png
          copy_unique_capture catalog-mobile.png 13-catalog-management.png
          copy_flow_capture semantic-output percentage-editor.png 14-discount-percentage.png
          copy_flow_capture latest-result-is-valid calculation-error.png 14-discount-error.png
          copy_flow_capture visible-for-manual-review ambiguous-discount.png 14-discount-ambiguous.png
          copy_flow_capture mobile-or-desktop responsive-editor-mobile.png 14-discount-responsive-mobile.png
          copy_flow_capture mobile-or-desktop responsive-editor-desktop.png 14-discount-responsive-desktop.png
          copy_flow_capture restored-total cancel-restored.png 14-discount-cancel.png
          copy_flow_capture partial-unit-discount-editor partial-unit-discount-mobile.png 14-discount-partial-mobile.png
          copy_flow_capture partial-unit-discount-editor partial-unit-discount-desktop.png 14-discount-partial-desktop.png
          copy_flow_capture invoice-editor-desktop invoice-editor-desktop.png 15-invoice-editor-desktop.png
          copy_flow_capture invoice-editor-mobile invoice-editor-mobile.png 15-invoice-editor-mobile.png
          copy_flow_capture invoice-editor-error invoice-editor-calculation-error.png 15-invoice-editor-error.png

          copy_unique_capture inventory-mobile.png 20-inventory-overview-mobile.png
          copy_unique_capture inventory-desktop.png 20-inventory-overview-desktop.png
          copy_unique_capture catalog-product-list-desktop.png 21-product-list-desktop.png
          copy_unique_capture catalog-product-detail-desktop.png 22-product-detail-desktop.png
          copy_unique_capture inventory-product-editor-mobile.png 22-product-editor-mobile.png
          copy_unique_capture inventory-product-delete-mobile.png 22-product-delete-mobile.png
          copy_unique_capture categories-mobile.png 23-categories-mobile.png
          copy_unique_capture categories-desktop.png 23-categories-desktop.png
          copy_unique_capture stores-mobile.png 24-stores-mobile.png
          copy_unique_capture inventory-statistics-desktop.png 24-statistics-desktop.png
          copy_unique_capture ticket-history-mobile.png 25-ticket-history-mobile.png
          copy_unique_capture ticket-history-desktop.png 25-ticket-history-desktop.png
          copy_unique_capture ticket-editor-desktop.png 25-ticket-editor-desktop.png

          test "$(find evidence-assets -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 43
          test "$(find evidence-assets -maxdepth 1 -type f -name '*.gif' | wc -l)" -eq 11
          test "$(find evidence-assets -maxdepth 1 -type f -name '*.webm' | wc -l)" -eq 11

          while IFS= read -r file; do
            test "$(stat -c %s "$file")" -le 25000000
          done < <(find evidence-assets -maxdepth 1 -type f -print)

      - name: Upload prepared visual evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: basketra-prepared-visual-evidence
          path: evidence-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: "🖼️ Publish direct PR evidence"
    needs:
      - classify
      - prepare
    if: >-
      needs.classify.outputs.required == 'true' &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
      HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
      RUN_ID: ${{ needs.classify.outputs.run_id }}
      EVIDENCE_TAG: pr-${{ needs.classify.outputs.pr_number }}-visual-evidence
    steps:
      - name: Download prepared visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-assets
          gh run download "$GITHUB_RUN_ID" \
            --repo "$REPOSITORY" \
            --name basketra-prepared-visual-evidence \
            --dir evidence-assets
          test -n "$(find evidence-assets -type f -print -quit)"
          if find evidence-assets -type l -print -quit | grep -q .; then
            echo "Prepared visual evidence must not contain symbolic links" >&2
            exit 1
          fi

      - name: Replace the temporary visual-evidence release
        shell: bash
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication: event head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

          gh release delete "$EVIDENCE_TAG" \
            --repo "$REPOSITORY" \
            --cleanup-tag \
            --yes >/dev/null 2>&1 || true

          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication: event head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

          gh release create "$EVIDENCE_TAG" evidence-assets/* \
            --repo "$REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "PR #$PR_NUMBER visual evidence" \
            --notes "Temporary directly viewable screenshots, GIFs and videos generated from $HEAD_SHA. Removed automatically when the pull request closes."

      - name: Publish or update the visual-evidence comment
        shell: bash
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Refusing stale visual evidence publication: event head $HEAD_SHA, current PR head $current_head" >&2
            exit 1
          fi

          base="https://github.com/$REPOSITORY/releases/download/$EVIDENCE_TAG"
          reference_base="https://raw.githubusercontent.com/$REPOSITORY/$HEAD_SHA/.agents/specs/assets/2026-09-02-professional-inventory"
          run_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"

          cat > comment.md <<EOF
          <!-- basketra-visual-evidence -->
          ## Visual evidence

          Generated from final head \`$HEAD_SHA\` after the [successful browser workflow]($run_url). The media is temporary, directly viewable and is not committed to the repository.

          ### Professional Inventory and Ticket History parity

          The left column is the approved normative reference committed in this exact head. The right column is Browser E2E evidence generated from the same head. References are not regenerated or modified by this workflow.

