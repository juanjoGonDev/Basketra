name: Publish verified private GHCR image and release

on:
  workflow_run:
    workflows:
      - Pull Request Quality
    types:
      - completed

permissions: read-all

concurrency:
  group: ghcr-main-publication
  cancel-in-progress: false

jobs:
  publish-image:
    name: "🚀 Publish verified private GHCR image and release"
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/juanjogondev/basketra
      GHCR_RETAIN_SHA_VERSIONS: '10'
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.VALIDATED_SHA }}
      - name: Verify immutable validated head
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - name: Resolve deterministic patch release
        id: release-version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { resolveReleaseVersion } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-version-policy.mjs`);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const resolved = resolveReleaseVersion(releases, process.env.VALIDATED_SHA);
            core.setOutput('version', resolved.version);
            core.setOutput('tag', resolved.tag);
            core.setOutput('reused', String(resolved.reused));
            core.info(`Release ${resolved.tag} assigned to ${process.env.VALIDATED_SHA}; reused=${resolved.reused}`);
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # pinned 2026-07-03
      - name: Publish immutable SHA candidate
        id: publish-sha
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/juanjogondev/basketra:${{ env.VALIDATED_SHA }}
          build-args: |
            BASKETRA_VERSION=${{ steps.release-version.outputs.version }}
            BASKETRA_REVISION=${{ env.VALIDATED_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.VALIDATED_SHA }}
            org.opencontainers.image.version=${{ steps.release-version.outputs.version }}
            org.opencontainers.image.title=Basketra
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publish-multiarch
          cache-to: type=gha,mode=max,scope=publish-multiarch
      - name: Verify published SHA tag and manifest
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$VALIDATED_SHA" > candidate-manifest.json
          node scripts/ghcr-manifest-policy.mjs candidate candidate-manifest.json "$DIGEST"
      - name: Pull and smoke-test the exact published digest
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          container=basketra-published-${GITHUB_RUN_ID}
          volume=basketra-published-data-${GITHUB_RUN_ID}
          cleanup() {
            docker rm --force "$container" 2>/dev/null || true
            docker volume rm "$volume" 2>/dev/null || true
          }
          trap cleanup EXIT
          docker pull --platform linux/amd64 "$IMAGE:$VALIDATED_SHA"
          revision=$(docker image inspect "$IMAGE:$VALIDATED_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          version=$(docker image inspect "$IMAGE:$VALIDATED_SHA" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          test "$revision" = "$VALIDATED_SHA"
          test "$version" = "$RELEASE_VERSION"
          docker run --detach --name "$container" \
            --read-only \
            --tmpfs /tmp/basketra:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 192m \
            --memory-swap 192m \
            --cpus 0.75 \
            --env NODE_OPTIONS=--max-old-space-size=128 \
            --publish 127.0.0.1:3001:3000 \
            --volume "$volume:/data" \
            "$IMAGE@$DIGEST"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/readiness; then break; fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/api/v1/runtime | \
            node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk).on("end",()=>{const runtime=JSON.parse(text);if(runtime.version!==process.env.RELEASE_VERSION||runtime.revision!==process.env.VALIDATED_SHA)process.exit(1)})'
          started=$(date +%s)
          docker stop --time 20 "$container"
          elapsed=$(($(date +%s)-started))
          test "$elapsed" -le 20
          test "$(docker inspect "$container" --format '{{.State.ExitCode}}')" = "0"
      - name: Promote verified digest to stable
        id: promote
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
        run: docker buildx imagetools create --metadata-file stable-promotion.json --tag "$IMAGE:stable" "$IMAGE@$DIGEST"
      - name: Verify stable is the validated manifest
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:stable" > stable-manifest.json && \
              node scripts/ghcr-manifest-policy.mjs stable candidate-manifest.json stable-manifest.json "$DIGEST"; then
              exit 0
            fi
            sleep 2
          done
          echo "stable does not resolve to the validated SHA digest" >&2
          exit 1
      - name: Promote verified digest to immutable version
        id: promote-version
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: docker buildx imagetools create --metadata-file version-promotion.json --tag "$IMAGE:$RELEASE_VERSION" "$IMAGE@$DIGEST"
      - name: Verify version is the validated manifest
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$RELEASE_VERSION" > version-manifest.json
          node scripts/ghcr-manifest-policy.mjs stable candidate-manifest.json version-manifest.json "$DIGEST"
      - name: Create or verify GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.RELEASE_TAG })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              if (existing.target_commitish !== process.env.VALIDATED_SHA) {
                throw new Error(`${process.env.RELEASE_TAG} already targets another commit`);
              }
              core.info(`Verified existing release ${process.env.RELEASE_TAG}`);
              return;
            }
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: process.env.VALIDATED_SHA,
              name: `Basketra ${process.env.RELEASE_VERSION}`,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
      - name: Enforce bounded GHCR release retention
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CURRENT_SHA: ${{ env.VALIDATED_SHA }}
          RETAIN_COUNT: ${{ env.GHCR_RETAIN_SHA_VERSIONS }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { selectGhcrVersionsForDeletion } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ghcr-retention-policy.mjs`);
            const { owner } = context.repo;
            let versions = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              versions = await github.paginate(
                'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                { username: owner, package_type: 'container', package_name: 'basketra', per_page: 100 },
              );
              if (versions.some((version) => version.metadata?.container?.tags?.includes(process.env.CURRENT_SHA))) break;
              if (attempt === 6) throw new Error('Published SHA package version did not become visible for retention');
              await new Promise((resolve) => setTimeout(resolve, 2_000));
            }
            const ids = selectGhcrVersionsForDeletion(
              versions,
              process.env.CURRENT_SHA,
              Number(process.env.RETAIN_COUNT),
            );
            for (const packageVersionId of ids) {
              await github.request(
                'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                {
                  username: owner,
                  package_type: 'container',
                  package_name: 'basketra',
                  package_version_id: packageVersionId,
                },
              );
            }
            core.info(`Deleted ${ids.length} superseded SHA-tagged package versions.`);
      - name: Delete an unpromoted failed candidate
        if: ${{ failure() && steps.publish-sha.outcome == 'success' && steps.promote.outcome != 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CURRENT_SHA: ${{ env.VALIDATED_SHA }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner } = context.repo;
            let versions = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              versions = await github.paginate(
                'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                { username: owner, package_type: 'container', package_name: 'basketra', per_page: 100 },
              );
              if (versions.some((version) => version.metadata?.container?.tags?.includes(process.env.CURRENT_SHA))) break;
              await new Promise((resolve) => setTimeout(resolve, 2_000));
            }
            const candidate = versions.find((version) =>
              version.metadata?.container?.tags?.includes(process.env.CURRENT_SHA),
            );
            if (!candidate) return;
            await github.request(
              'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
              {
                username: owner,
                package_type: 'container',
                package_name: 'basketra',
                package_version_id: candidate.id,
              },
            );
