name: Apply trusted receipt patch

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: basketra-apply-receipt-patch
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'juanjoGonDev/Basketra' &&
      github.event.pull_request.head.ref == 'agent/feat-basketra-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/feat-basketra-foundation
          fetch-depth: 0
      - name: Apply staged transforms
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          transforms=(.patches/*.py)
          if [ "${#transforms[@]}" -eq 0 ]; then
            echo "No staged transforms"
            exit 0
          fi
          for transform in "${transforms[@]}"; do
            python3 "$transform"
          done
          rm -rf .patches
          node scripts/security-scan.mjs
          node scripts/format-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(data): preserve receipt evidence"
          git push origin "HEAD:agent/feat-basketra-foundation"
