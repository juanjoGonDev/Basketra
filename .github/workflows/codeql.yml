name: CodeQL Advanced

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 7 * * 5'

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: actions
            language: actions
            config: ./.github/codeql/codeql-actions.yml
            sparse_checkout: |
              .github
          - scope: backend-catalog
            language: javascript-typescript
            config: ./.github/codeql/codeql-backend-catalog.yml
            sparse_checkout: |
              .github/codeql
              src/api/catalog-management-core.ts
              src/api/catalog-management.ts
              src/api/errors.ts
              src/api/inventory-management-core.ts
              src/api/inventory-management.ts
              src/api/inventory-read-model.ts
              src/domain
              src/infrastructure/catalog-repository.ts
              src/infrastructure/category-repository.ts
              src/infrastructure/category-schema.ts
              src/infrastructure/config.ts
              src/infrastructure/ids.ts
              src/infrastructure/inventory-schema.ts
              src/infrastructure/shopping-estimate.ts
              src/infrastructure/shopping-repository.ts
              src/offers
              src/products
              src/stores
              src/types
              package.json
              pnpm-lock.yaml
              pnpm-workspace.yaml
              tsconfig.json
              tsconfig.build.json
          - scope: backend-platform
            language: javascript-typescript
            config: ./.github/codeql/codeql-backend-platform.yml
            sparse_checkout: |
              .github/codeql
              src/api/errors.ts
              src/api/server.ts
              src/api/static-assets.ts
              src/domain
              src/infrastructure/collaboration-schema-core.ts
              src/infrastructure/collaboration-schema.ts
              src/infrastructure/config.ts
              src/infrastructure/database.ts
              src/infrastructure/files.ts
              src/infrastructure/inventory-schema.ts
              src/infrastructure/runtime-settings.ts
              src/main.ts
              src/public-api.ts
              src/realtime
              src/types
              package.json
              pnpm-lock.yaml
              pnpm-workspace.yaml
              tsconfig.json
              tsconfig.build.json
          - scope: backend-receipt-runtime
            language: javascript-typescript
            config: ./.github/codeql/codeql-backend-receipt-runtime.yml
            sparse_checkout: |
              .github/codeql
              src/api/errors.ts
              src/api/inventory-ticket-management.ts
              src/api/receipt-calculation.ts
              src/api/server.ts
              src/domain
              src/infrastructure/config.ts
              src/infrastructure/database.ts
              src/infrastructure/files.ts
              src/infrastructure/runtime-settings.ts
              src/receipts
              src/types
              package.json
              pnpm-lock.yaml
              pnpm-workspace.yaml
              tsconfig.json
              tsconfig.build.json
          - scope: backend-receipt-ai
            language: javascript-typescript
            config: ./.github/codeql/codeql-backend-receipt-ai.yml
            sparse_checkout: |
              .github/codeql
              src/ai
              src/api/errors.ts
              src/api/receipt-calculation.ts
              src/api/server.ts
              src/domain
              src/infrastructure/config.ts
              src/infrastructure/files.ts
              src/infrastructure/runtime-settings.ts
              src/ocr
              src/receipts
              src/types
              package.json
              pnpm-lock.yaml
              pnpm-workspace.yaml
              tsconfig.json
              tsconfig.build.json
          - scope: backend-operations
            language: javascript-typescript
            config: ./.github/codeql/codeql-backend-operations.yml
            sparse_checkout: |
              .github/codeql
              src/api/errors.ts
              src/api/inventory-ticket-management.ts
              src/api/server.ts
              src/domain
              src/infrastructure/collaboration-schema-core.ts
              src/infrastructure/collaboration-schema.ts
              src/infrastructure/config.ts
              src/infrastructure/database.ts
              src/infrastructure/runtime-settings.ts
              src/operations
              src/realtime
              src/types
              package.json
              pnpm-lock.yaml
              pnpm-workspace.yaml
              tsconfig.json
              tsconfig.build.json
          - scope: web
            language: javascript-typescript
            config: ./.github/codeql/codeql-web.yml
            sparse_checkout: |
              .github/codeql
              src/web
              package.json
              pnpm-lock.yaml
              pnpm-workspace.yaml
          - scope: automation
            language: javascript-typescript
            config: ./.github/codeql/codeql-automation.yml
            sparse_checkout: |
              .github/codeql
              scripts
              playwright.config.mjs
              package.json
              pnpm-lock.yaml
              pnpm-workspace.yaml
              tsconfig.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: ${{ matrix.sparse_checkout }}
          sparse-checkout-cone-mode: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.config }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          category: /language:${{ matrix.language }}/scope:${{ matrix.scope }}
