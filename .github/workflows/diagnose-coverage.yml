name: Diagnose Browser coverage gate

on:
  push:
    branches:
      - arena/01a0a6e0-basketra

permissions: read-all

concurrency:
  group: diagnose-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    name: "Reproduce aggregate browser coverage gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASKETRA_BROWSER_COVERAGE_COLLECT_ONLY: "1"
      BASKETRA_BROWSER_PREBUILT: "1"
      BASKETRA_COVERAGE_BASE: c260374224b5b575280ee4942ae11caa4f147fe5
      PLAYWRIGHT_JSON_OUTPUT_NAME: ".ci/spec-report.json"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm and TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          npm install --global --ignore-scripts typescript@5.8.3
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore exact Chromium cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: basketra-diagnose-playwright-${{ runner.os }}-1.59.1
          restore-keys: |
            basketra-playwright-${{ runner.os }}-1.59.1-
      - name: Install exact Chromium binary
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Build browser runtime
        run: pnpm build
      - name: Run the new and changed boundary specs
        run: |
          set -uo pipefail
          pnpm exec playwright test \
            tests/browser/receipt-editor-evidence-boundaries.spec.mjs \
            tests/browser/ai-provider-diagnostics.spec.mjs \
            --reporter=json --workers=1 || true
          test -f .ci/spec-report.json
      - name: Publish spec results as annotations
        if: always()
        run: node .ci/report-diagnose-failures.mjs .ci/spec-report.json "boundary specs"
      - name: Run the changed-code coverage gate over the new coverage only
        run: |
          set -uo pipefail
          {
            echo "coverage files: $(find .coverage/browser -type f -name '*.json' | wc -l)"
            echo "head: $(git rev-parse HEAD)"
          } > .ci/gate-output.txt
          node scripts/check-browser-diff-coverage.mjs >> .ci/gate-output.txt 2>&1
          echo "gate exit: $?" >> .ci/gate-output.txt
          cat .ci/gate-output.txt
      - name: Publish the residual coverage list as an annotation
        if: always()
        run: node .ci/report-gate-output.mjs .ci/gate-output.txt "residual uncovered (new specs only)"
