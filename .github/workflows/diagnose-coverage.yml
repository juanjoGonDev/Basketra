name: Diagnose Browser coverage gate

on:
  push:
    branches:
      - arena/01a0a6e0-basketra

permissions: read-all

concurrency:
  group: diagnose-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    name: "Reproduce aggregate browser coverage gate"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Download shard coverage from the Pull Request Quality run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: basketra-browser-coverage-*
          path: downloaded-coverage
          run-id: 35080943278
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge shard coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .coverage/browser
          while IFS= read -r file; do
            artifact=$(printf '%s' "$file" | sed 's#^downloaded-coverage/##; s#/.*##')
            cp "$file" ".coverage/browser/$artifact-$(basename "$file")"
          done < <(find downloaded-coverage -type f -name '*.json' -print | sort)
          {
            echo "merged files: $(find .coverage/browser -type f -name '*.json' | wc -l)"
            echo "merged bytes: $(du -sb .coverage/browser | cut -f1)"
            echo "first files: $(find .coverage/browser -type f -name '*.json' -print | sort | head -3 | tr '\n' ' ')"
            echo "head: $(git rev-parse HEAD)"
            echo "base: c260374224b5b575280ee4942ae11caa4f147fe5"
          } > .ci/coverage-summary.txt
          cat .ci/coverage-summary.txt
      - name: Run the aggregate changed-code coverage gate
        env:
          BASKETRA_COVERAGE_BASE: c260374224b5b575280ee4942ae11caa4f147fe5
        run: |
          set -uo pipefail
          node scripts/check-browser-diff-coverage.mjs > .ci/gate-output.txt 2>&1
          echo "gate exit: $?" >> .ci/gate-output.txt
          cat .ci/gate-output.txt
      - name: Publish gate output as annotations
        if: always()
        run: |
          node .ci/report-gate-output.mjs .ci/coverage-summary.txt "coverage inputs"
          node .ci/report-gate-output.mjs .ci/gate-output.txt "browser coverage gate"
