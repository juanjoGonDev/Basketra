name: Patch clean visual evidence

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: basketra-patch-visual-evidence
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'juanjoGonDev/Basketra' &&
      github.event.pull_request.head.ref == 'agent/feat-basketra-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/feat-basketra-foundation
          fetch-depth: 0
      - name: Patch evidence capture
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/browser/basketra.spec.mjs')
          text = path.read_text()
          old = """test.afterEach(async ({ page }, testInfo) => {
            await page.screenshot({ path: testInfo.outputPath('final.png'), fullPage: true });
          });
          """
          new = """test.afterEach(async ({ page }, testInfo) => {
            if (page.isClosed()) return;
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(100);
            await page.screenshot({ path: testInfo.outputPath('viewport.png') });
            const activeView = page.locator('.view.active');
            if (await activeView.count()) {
              await activeView.screenshot({ path: testInfo.outputPath('final.png') });
            }
          });
          """
          if old not in text:
              raise SystemExit('Expected afterEach screenshot block was not found')
          path.write_text(text.replace(old, new))
          PY
          node scripts/format-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/basketra.spec.mjs
          git diff --cached --check
          git commit -m "test(ui): capture clean mobile evidence"
          git push origin "HEAD:agent/feat-basketra-foundation"
