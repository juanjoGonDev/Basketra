name: Apply receipt correlation patch

on:
  push:
    branches:
      - agent/fix-receipt-ai-resume-tracing

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci(receipts): apply correlation patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-receipt-ai-resume-tracing
          persist-credentials: true

      - name: Patch receipt job correlation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/api/server.ts')
          source = path.read_text()
          old = """  }): Readonly<Record<string, unknown>> {\n    return {\n      id: job.id,\n      status: job.status,\n      ...(job.result === undefined ? {} : { extraction: job.result }),\n      ...(job.errorCode === undefined ? {} : { errorCode: job.errorCode }),\n      createdAt: job.createdAt,\n"""
          new = """  }): Readonly<Record<string, unknown>> {\n    const durable = this.#receiptDurableStore.get(job.id);\n    const webApiResponseIds = [...new Set(\n      durable?.pages.flatMap((page) => page.responseId ? [page.responseId] : []) ?? [],\n    )];\n    return {\n      id: job.id,\n      status: job.status,\n      ...(job.result === undefined ? {} : { extraction: job.result }),\n      ...(job.errorCode === undefined ? {} : { errorCode: job.errorCode }),\n      ...(webApiResponseIds.length === 0 ? {} : { webApiResponseIds }),\n      createdAt: job.createdAt,\n"""
          if source.count(old) != 1:
              raise SystemExit('expected receiptExtractionJobResponse anchor exactly once')
          path.write_text(source.replace(old, new))
          PY
          node scripts/format-check.mjs

      - name: Commit bounded correlation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/server.ts
          git diff --cached --check
          git commit -m 'feat(receipts): expose durable webapi correlation'
          git push origin HEAD:agent/fix-receipt-ai-resume-tracing
