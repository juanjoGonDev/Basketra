name: Patch UI follow-up fixes

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: basketra-patch-ui-followups
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'juanjoGonDev/Basketra' &&
      github.event.pull_request.head.ref == 'agent/feat-basketra-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/feat-basketra-foundation
          fetch-depth: 0
      - name: Apply focused UI fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/web/ui.js'): [("'maximum-savings':", "'maximum-saving':")],
              Path('src/web/sw.js'): [
                  ("const CACHE='basketra-shell-v1';", "const CACHE='basketra-shell-v2';"),
                  ("'/app.js','/styles.css'", "'/app.js','/ui.js','/styles.css'"),
              ],
              Path('tests/browser/basketra.spec.mjs'): [
                  ("page.locator('.surface').first()", "page.locator('.view.active .surface').first()"),
              ],
              Path('tests/e2e/pwa-shell.test.ts'): [
                  ("assert.match(serviceWorker, /url\\.pathname\\.startsWith\\('\\/api\\/'\\)/);", "assert.match(serviceWorker, /url\\.pathname\\.startsWith\\('\\/api\\/'\\)/);\n  assert.match(serviceWorker, /'\\/ui\\.js'/);"),
              ],
          }
          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          node scripts/format-check.mjs
          node --experimental-strip-types --test tests/e2e/pwa-shell.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/ui.js src/web/sw.js tests/browser/basketra.spec.mjs tests/e2e/pwa-shell.test.ts
          if git diff --cached --quiet; then
            echo "UI follow-up fixes are already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(ui): align plans and offline shell"
          git push origin "HEAD:agent/feat-basketra-foundation"
