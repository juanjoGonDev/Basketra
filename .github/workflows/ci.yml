name: Pull Request Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "✅ Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm and TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          npm install --global --ignore-scripts typescript@5.8.3
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run quality gate
        run: pnpm quality
      - name: Enforce resource and growth budgets
        run: pnpm resource:measure

  security:
    name: "🔒 Security"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Scan repository policy and secrets
        run: node scripts/security-scan.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  browser-e2e:
    name: "🌐 Browser E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Install exact browser test tooling
        run: |
          npm install --global --ignore-scripts typescript@5.8.3
          npm install --no-save --ignore-scripts @playwright/test@1.59.1
          npx playwright install --with-deps chromium
      - name: Run mobile Chromium flows
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: basketra-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

  container:
    name: "📦 Container (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # pinned 2026-07-03
      - name: Build platform with SBOM and provenance
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  container-smoke:
    name: "🧪 Container smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose variants
        env:
          BASKETRA_AUTH_TOKEN: ci-validation-placeholder
          BASKETRA_DOCKER_CONFIG_DIR: /tmp/basketra-docker-config
        run: |
          mkdir -p "$BASKETRA_DOCKER_CONFIG_DIR"
          docker compose config --quiet
          docker compose -f compose.raspberry.yml config --quiet
      - name: Build local image
        run: docker build --tag basketra:ci .
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # pinned 2026-07
        with:
          image-ref: basketra:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Start hardened container
        run: |
          docker run --detach --name basketra-ci \
            --read-only \
            --tmpfs /tmp/basketra:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 192m \
            --memory-swap 192m \
            --cpus 0.75 \
            --env NODE_OPTIONS=--max-old-space-size=128 \
            --publish 127.0.0.1:3000:3000 \
            --volume basketra-ci-data:/data \
            basketra:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/readiness; then exit 0; fi
            sleep 1
          done
          docker logs basketra-ci
          exit 1
      - name: Verify runtime limits and graceful shutdown
        run: |
          test "$(docker inspect basketra-ci --format '{{.HostConfig.Memory}}')" = "201326592"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.MemorySwap}}')" = "201326592"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.PidsLimit}}')" = "128"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          started=$(date +%s)
          docker stop --time 20 basketra-ci
          elapsed=$(($(date +%s)-started))
          test "$elapsed" -le 20
      - name: Inspect image and cleanup
        if: always()
        run: |
          docker image inspect basketra:ci --format 'image_size={{.Size}} bytes'
          docker logs basketra-ci 2>/dev/null || true
          docker rm --force basketra-ci 2>/dev/null || true
          docker volume rm basketra-ci-data 2>/dev/null || true

  publish-image:
    name: "🚀 Publish verified private GHCR image"
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - quality
      - security
      - browser-e2e
      - container
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/juanjogondev/basketra
      GHCR_RETAIN_SHA_VERSIONS: '10'
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # pinned 2026-07-03
      - name: Publish immutable SHA candidate
        id: publish-sha
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/juanjogondev/basketra:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Basketra
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publish-multiarch
          cache-to: type=gha,mode=max,scope=publish-multiarch
      - name: Verify published SHA tag and manifest
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$GITHUB_SHA" > candidate-manifest.json
          node scripts/ghcr-manifest-policy.mjs candidate candidate-manifest.json "$DIGEST"
      - name: Pull and smoke-test the exact published digest
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
        run: |
          set -euo pipefail
          container=basketra-published-${GITHUB_RUN_ID}
          volume=basketra-published-data-${GITHUB_RUN_ID}
          cleanup() {
            docker rm --force "$container" 2>/dev/null || true
            docker volume rm "$volume" 2>/dev/null || true
          }
          trap cleanup EXIT
          docker pull --platform linux/amd64 "$IMAGE:$GITHUB_SHA"
          revision=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$GITHUB_SHA"
          docker run --detach --name "$container" \
            --read-only \
            --tmpfs /tmp/basketra:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 192m \
            --memory-swap 192m \
            --cpus 0.75 \
            --env NODE_OPTIONS=--max-old-space-size=128 \
            --publish 127.0.0.1:3001:3000 \
            --volume "$volume:/data" \
            "$IMAGE@$DIGEST"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/readiness; then break; fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          started=$(date +%s)
          docker stop --time 20 "$container"
          elapsed=$(($(date +%s)-started))
          test "$elapsed" -le 20
          test "$(docker inspect "$container" --format '{{.State.ExitCode}}')" = "0"
      - name: Promote verified digest to stable
        id: promote
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
        run: docker buildx imagetools create --metadata-file stable-promotion.json --tag "$IMAGE:stable" "$IMAGE@$DIGEST"
      - name: Verify stable is the validated manifest
        env:
          DIGEST: ${{ steps.publish-sha.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:stable" > stable-manifest.json && \
              node scripts/ghcr-manifest-policy.mjs stable candidate-manifest.json stable-manifest.json "$DIGEST"; then
              exit 0
            fi
            sleep 2
          done
          echo "stable does not resolve to the validated SHA digest" >&2
          exit 1
      - name: Enforce bounded GHCR release retention
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CURRENT_SHA: ${{ github.sha }}
          RETAIN_COUNT: ${{ env.GHCR_RETAIN_SHA_VERSIONS }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { selectGhcrVersionsForDeletion } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ghcr-retention-policy.mjs`);
            const { owner } = context.repo;
            let versions = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              versions = await github.paginate(
                'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                { username: owner, package_type: 'container', package_name: 'basketra', per_page: 100 },
              );
              if (versions.some((version) => version.metadata?.container?.tags?.includes(process.env.CURRENT_SHA))) break;
              if (attempt === 6) throw new Error('Published SHA package version did not become visible for retention');
              await new Promise((resolve) => setTimeout(resolve, 2_000));
            }
            const ids = selectGhcrVersionsForDeletion(
              versions,
              process.env.CURRENT_SHA,
              Number(process.env.RETAIN_COUNT),
            );
            for (const packageVersionId of ids) {
              await github.request(
                'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                {
                  username: owner,
                  package_type: 'container',
                  package_name: 'basketra',
                  package_version_id: packageVersionId,
                },
              );
            }
            core.info(`Deleted ${ids.length} superseded SHA-tagged package versions.`);
      - name: Delete an unpromoted failed candidate
        if: ${{ failure() && steps.publish-sha.outcome == 'success' && steps.promote.outcome != 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CURRENT_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner } = context.repo;
            let versions = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              versions = await github.paginate(
                'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                { username: owner, package_type: 'container', package_name: 'basketra', per_page: 100 },
              );
              if (versions.some((version) => version.metadata?.container?.tags?.includes(process.env.CURRENT_SHA))) break;
              await new Promise((resolve) => setTimeout(resolve, 2_000));
            }
            const candidate = versions.find((version) =>
              version.metadata?.container?.tags?.includes(process.env.CURRENT_SHA),
            );
            if (!candidate) return;
            await github.request(
              'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
              {
                username: owner,
                package_type: 'container',
                package_name: 'basketra',
                package_version_id: candidate.id,
              },
            );
