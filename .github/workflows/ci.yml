name: Pull Request Quality

on:
  pull_request:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: "✅ Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm and TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          npm install --global --ignore-scripts typescript@5.8.3
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run quality gate
        run: pnpm quality
      - name: Enforce resource and growth budgets
        run: pnpm resource:measure

  security:
    name: "🔒 Security"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Scan repository policy and secrets
        run: node scripts/security-scan.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  browser-e2e:
    name: "🌐 Browser E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Install exact browser test tooling
        timeout-minutes: 8
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/apt-mirrors.txt
          fi
          npm install --global --ignore-scripts typescript@5.8.3
          npm install --no-save --ignore-scripts @playwright/test@1.59.1
          npx playwright install --with-deps chromium
      - name: Run mobile Chromium flows
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: basketra-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compact invoice evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: basketra-invoice-visual-evidence
          path: test-results/**/invoice-editor-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compact category evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: basketra-category-visual-evidence
          path: test-results/**/categories-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload compact screenshot evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: basketra-visual-screenshot-evidence
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7

  container:
    name: "📦 Container (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # pinned 2026-07-03
      - name: Build platform with SBOM and provenance
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  container-smoke:
    name: "🧪 Container smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose variants
        env:
          BASKETRA_DOCKER_CONFIG_DIR: /tmp/basketra-docker-config
        run: |
          mkdir -p "$BASKETRA_DOCKER_CONFIG_DIR"
          docker compose config --quiet
          docker compose -f compose.raspberry.yml config --quiet
      - name: Build local image
        run: docker build --tag basketra:ci .
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned 2026-07
        with:
          image-ref: basketra:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Start hardened container
        run: |
          docker run --detach --name basketra-ci \
            --read-only \
            --tmpfs /tmp/basketra:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 192m \
            --memory-swap 192m \
            --cpus 0.75 \
            --env NODE_OPTIONS=--max-old-space-size=128 \
            --publish 127.0.0.1:3000:3000 \
            --volume basketra-ci-data:/data \
            basketra:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/readiness; then exit 0; fi
            sleep 1
          done
          docker logs basketra-ci
          exit 1
      - name: Verify runtime limits and graceful shutdown
        run: |
          test "$(docker inspect basketra-ci --format '{{.HostConfig.Memory}}')" = "201326592"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.MemorySwap}}')" = "201326592"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.PidsLimit}}')" = "128"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          started=$(date +%s)
          docker stop --time 20 basketra-ci
          elapsed=$(($(date +%s)-started))
          test "$elapsed" -le 20
      - name: Inspect image and cleanup
        if: always()
        run: |
          docker image inspect basketra:ci --format 'image_size={{.Size}} bytes'
          docker logs basketra-ci 2>/dev/null || true
          docker rm --force basketra-ci 2>/dev/null || true
          docker volume rm basketra-ci-data 2>/dev/null || true
