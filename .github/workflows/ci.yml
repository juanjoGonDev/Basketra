name: Pull Request Quality

on:
  pull_request:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: "✅ ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static quality
            command: pnpm format:check && pnpm lint && pnpm typecheck && pnpm deadcode && pnpm deps:check
          - name: Unit
            command: pnpm test
          - name: Integration
            command: pnpm test:integration
          - name: Static E2E
            command: pnpm test:e2e
          - name: Domain coverage
            command: pnpm test:coverage
          - name: Changed coverage
            command: pnpm test:coverage:receipt-ai-backend
          - name: Web coverage
            command: pnpm test:coverage:receipt-ai-recovery && pnpm test:coverage:service-worker
          - name: Build
            command: pnpm build
          - name: Resource budgets
            command: pnpm resource:measure
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm and TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          npm install --global --ignore-scripts typescript@5.8.3
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run quality group
        run: ${{ matrix.command }}

  security:
    name: "🔒 Security"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Scan repository policy and secrets
        run: node scripts/security-scan.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  browser-runtime:
    name: "🌐 Browser runtime"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      shards: ${{ steps.shard-plan.outputs.shards }}
      total: ${{ steps.shard-plan.outputs.total }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm and TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          npm install --global --ignore-scripts typescript@5.8.3
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Plan bounded Browser shards
        id: shard-plan
        shell: bash
        run: |
          set -euo pipefail
          listing="$RUNNER_TEMP/playwright-list.txt"
          pnpm exec playwright test --list > "$listing"
          test_count=$(awk '/^Total: [0-9]+ tests? / { print $2 }' "$listing")
          if ! [[ "$test_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to resolve Browser test count from Playwright --list" >&2
            cat "$listing" >&2
            exit 1
          fi
          shard_count=$(( (test_count + 1) / 2 ))
          if [ "$shard_count" -gt 256 ]; then
            echo "Browser suite requires $shard_count shards, above GitHub's 256-job matrix limit" >&2
            exit 1
          fi
          shards=$(node -e 'const n=Number(process.argv[1]); process.stdout.write(JSON.stringify(Array.from({length:n},(_,i)=>i+1)))' "$shard_count")
          echo "total=$shard_count" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "Planned $shard_count Browser shards for $test_count tests (maximum two tests per shard)."
      - name: Build browser runtime once
        run: pnpm build
      - name: Restore exact Chromium cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: basketra-playwright-${{ runner.os }}-1.59.1-${{ github.event.pull_request.head.sha }}
      - name: Install exact Chromium binary
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Upload prebuilt browser runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: basketra-browser-runtime
          path: dist
          if-no-files-found: error
          retention-days: 1

  browser-e2e:
    name: "🌐 Browser ${{ matrix.shard }}/${{ needs.browser-runtime.outputs.total }}"
    needs: browser-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        shard: ${{ fromJSON(needs.browser-runtime.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore exact Chromium cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: basketra-playwright-${{ runner.os }}-1.59.1-${{ github.event.pull_request.head.sha }}
          fail-on-cache-miss: true
      - name: Download prebuilt browser runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name basketra-browser-runtime \
            --dir dist
          test -f dist/main.js
      - name: Run Chromium shard
        env:
          BASKETRA_BROWSER_COVERAGE_COLLECT_ONLY: "1"
          BASKETRA_BROWSER_PREBUILT: "1"
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ needs.browser-runtime.outputs.total }}
      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: basketra-browser-shard-${{ matrix.shard }}
          path: |
            .coverage/browser
            test-results
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  browser-coverage:
    name: "🌐 Browser coverage"
    needs: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download shard coverage
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'basketra-browser-shard-*' \
            --dir downloaded-coverage
          mkdir -p .coverage/browser
          while IFS= read -r file; do
            artifact=$(printf '%s' "$file" | sed 's#^downloaded-coverage/##; s#/.*##')
            cp "$file" ".coverage/browser/$artifact-$(basename "$file")"
          done < <(find downloaded-coverage -type f -path '*/.coverage/browser/*.json' -print | sort)
          test "$(find .coverage/browser -type f -name '*.json' | wc -l)" -gt 0
      - name: Enforce aggregate changed-code coverage
        run: node scripts/check-browser-diff-coverage.mjs

  container:
    name: "📦 Container (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # pinned 2026-07-03
      - name: Build platform with SBOM and provenance
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  container-smoke:
    name: "🧪 Container smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose variants
        env:
          BASKETRA_DOCKER_CONFIG_DIR: /tmp/basketra-docker-config
        run: |
          mkdir -p "$BASKETRA_DOCKER_CONFIG_DIR"
          docker compose config --quiet
          docker compose -f compose.raspberry.yml config --quiet
      - name: Build local image
        run: docker build --tag basketra:ci .
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned 2026-07
        with:
          image-ref: basketra:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Start hardened container
        run: |
          docker run --detach --name basketra-ci \
            --read-only \
            --tmpfs /tmp/basketra:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 192m \
            --memory-swap 192m \
            --cpus 0.75 \
            --env NODE_OPTIONS=--max-old-space-size=128 \
            --publish 127.0.0.1:3000:3000 \
            --volume basketra-ci-data:/data \
            basketra:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/readiness; then exit 0; fi
            sleep 1
          done
          docker logs basketra-ci
          exit 1
      - name: Verify runtime limits and graceful shutdown
        run: |
          test "$(docker inspect basketra-ci --format '{{.HostConfig.Memory}}')" = "201326592"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.MemorySwap}}')" = "201326592"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.PidsLimit}}')" = "128"
          test "$(docker inspect basketra-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          started=$(date +%s)
          docker stop --time 20 basketra-ci
          elapsed=$(($(date +%s)-started))
          test "$elapsed" -le 20
      - name: Inspect image and cleanup
        if: always()
        run: |
          docker image inspect basketra:ci --format 'image_size={{.Size}} bytes'
          docker logs basketra-ci 2>/dev/null || true
          docker rm --force basketra-ci 2>/dev/null || true
          docker volume rm basketra-ci-data 2>/dev/null || true
