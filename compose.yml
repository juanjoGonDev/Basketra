name: basketra
services:
  basketra:
    image: basketra:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "--max-old-space-size=128", "dist/main.js"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - basketra-data:/data
    tmpfs:
      - /tmp/basketra:rw,noexec,nosuid,size=32m,mode=0700,uid=1000,gid=1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.75
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  basketra-data:
    name: basketra-data
