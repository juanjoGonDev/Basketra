name: basketra
services:
  basketra:
    image: basketra:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BASKETRA_PORT:-3000}:3000"
    environment:
      BASKETRA_HOST: 0.0.0.0
      BASKETRA_PORT: 3000
      BASKETRA_DATA_DIR: /data
      BASKETRA_TEMP_DIR: /tmp/basketra
      BASKETRA_AUTH_TOKEN: ${BASKETRA_AUTH_TOKEN:-}
      BASKETRA_MAX_BODY_BYTES: ${BASKETRA_MAX_BODY_BYTES:-8388608}
      BASKETRA_AI_BASE_URL: ${BASKETRA_AI_BASE_URL:-}
      BASKETRA_AI_API_KEY: ${BASKETRA_AI_API_KEY:-}
      BASKETRA_AI_MODEL: ${BASKETRA_AI_MODEL:-}
      BASKETRA_AI_TIMEOUT_MS: ${BASKETRA_AI_TIMEOUT_MS:-30000}
      BASKETRA_AI_MAX_RETRIES: ${BASKETRA_AI_MAX_RETRIES:-1}
      BASKETRA_AI_IMAGE_CAPABILITY: ${BASKETRA_AI_IMAGE_CAPABILITY:-true}
      BASKETRA_AI_PDF_CAPABILITY: ${BASKETRA_AI_PDF_CAPABILITY:-false}
      BASKETRA_IDLE_HIBERNATE_AFTER_MS: ${BASKETRA_IDLE_HIBERNATE_AFTER_MS:-300000}
      IDLE_EXIT_AFTER_MS: ${IDLE_EXIT_AFTER_MS:-0}
    volumes:
      - basketra-data:/data
    tmpfs:
      - /tmp/basketra:rw,noexec,nosuid,size=32m,mode=0700,uid=1000,gid=1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.75
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  basketra-data:
    name: basketra-data
